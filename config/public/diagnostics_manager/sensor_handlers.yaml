mrs_uav_managers:
  diagnostics_manager:
    sensor_handlers:
      # the list of sensors to monitor; only instances named here are actually loaded
      active_sensor_handlers: [
          # Example sensor handlers
          "PX4",
          "Rangefinder",
          "GNSS",
          "Magnetometer",
          "RemoteController",
          # "SimulationCamera"
          # "LidarHandler",
          # "IMUHandler",
          # "BatteryHandler",
          # "RangeFinderHandler",
        ]

      # -------------------------------------------------------------------
      # TEMPLATE (not an active instance -- copy/paste and rename to use)
      #
      # ExampleHandler:
      #   address: "mrs_uav_diagnostics_sensors/GenericSensorHandler" # pluginlib class backing this instance
      #   type: "Example" # Example, AUTOPILOT, RANGEFINDER, GNSS, IMU, BAROMETER, MAGNETOMETER, LIDAR, CAMERA, REMOTE_CONTROLLER
      #   topic: "example_node/topic" # Don't add the leading slash, the name will be resolved relative to the node's namespace
      #   expected_publisher:
      #     node: "example_node" # Name of the node expected to publish the topic (optional, used for more specific diagnostics)
      #     component: "example_component" # Name of the component within the node expected to publish the topic (optional)
      #   qos_reliability: "reliable" # QoS reliability setting (default: "reliable")
      #   expected_rate: 10.0 # Hz, or "N+" (e.g. "10+") to check only the floor and skip the "rate too high" check
      #   rate_tolerance: 0.3 # 30% deviation allowed (default); still applies to the floor when using "N+"
      #   check_frame_transform: true # WARN if this sensor's frame can't transform to body_frame (default: true)
      #   message_type: "sensor_msgs/msg/Range" # example plugin-specific field (GenericSensorHandler here); declare
      #                                          # it alongside the others, no separate file needed
      #   plugin_config: "" # optional path to an external YAML file for plugin-specific fields instead, e.g. if reused
      #                      # across instances
      #
      # NOTE: to add your own sensor without touching this package, override active_sensor_handlers (full list, not
      # just the addition) and define the new instance -- same shape as an entry below -- in your deployment's custom_config:
      #   mrs_uav_managers:
      #     diagnostics_manager:
      #       sensor_handlers:
      #         active_sensor_handlers: ["PX4", "Rangefinder", ..., "MyLidar"]
      #         MyLidar:
      #           address: "mrs_uav_diagnostics_sensors/GenericSensorHandler"
      #           type: "LIDAR"
      #           topic: "my_lidar/range"
      #           message_type: "sensor_msgs/msg/Range"
      #           expected_rate: 10.0
      # -------------------------------------------------------------------

      # define "running" instances of plugins, there can be multiple instances of the same plugin
      SimulationCamera:
        address: "mrs_uav_diagnostics_sensors/CameraSensorHandler"
        type: "CAMERA"
        topic: "servo_camera/camera_info"
        qos_reliability: "reliable"
        expected_rate: 60.0
        rate_tolerance: 0.3

      # Using generic handler
      PX4:
        address: "mrs_uav_diagnostics_sensors/GenericSensorHandler"
        type: "AUTOPILOT"
        topic: "hw_api/status"
        message_type: "mrs_msgs/msg/HwApiStatus"
        qos_reliability: "reliable"
        expected_rate: 100.0
        rate_tolerance: 0.3
        check_frame_transform: false # no-op, no header.frame_id

      Rangefinder:
        address: "mrs_uav_diagnostics_sensors/GenericSensorHandler"
        type: "RANGEFINDER"
        topic: "hw_api/distance_sensor"
        message_type: "sensor_msgs/msg/Range"
        qos_reliability: "reliable"
        expected_rate: 100.0
        rate_tolerance: 0.3
        check_frame_transform: false # no-op, no header.frame_id

      GNSS:
        address: "mrs_uav_diagnostics_sensors/GNSSSensorHandler"
        type: "GNSS"
        topic: "hw_api/gnss"
        status_topic: "hw_api/gnss_status" # GNSSSensorHandler-specific
        qos_reliability: "reliable"
        expected_rate: 50.0
        rate_tolerance: 0.3
        check_frame_transform: false # TODO: re-enable once estimators report this via errorgraph

      Magnetometer:
        address: "mrs_uav_diagnostics_sensors/MagnetometerSensorHandler"
        type: "MAGNETOMETER"
        topic: "hw_api/magnetic_field"
        qos_reliability: "reliable"
        expected_rate: "10+"
        rate_tolerance: 0.3
        check_frame_transform: false # TODO: re-enable once estimators report this via errorgraph

      RemoteController:
        address: "mrs_uav_diagnostics_sensors/RCSensorHandler"
        type: "REMOTE_CONTROLLER"
        topic: "hw_api/rc_rssi"
        qos_reliability: "reliable"
        expected_rate: 10.0
        rate_tolerance: 0.3
        check_frame_transform: false # no-op, no header.frame_id
