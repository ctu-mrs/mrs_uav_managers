mrs_uav_managers:
  diagnostics_manager:
    # name of the network interface to report wifi link quality for (e.g. "wlan0"); leave empty to disable
    wifi_interface: ""

    sensor_handlers:
      # the list of sensors to monitor
      active_sensor_handlers: [
          # Example sensor handlers
          "PX4",
          "Rangefinder",
          "GNSS",
          "Magnetometer",
          "RemoteController",
          # "SimulationCamera"
          # "LidarHandler",
          # "IMUHandler",
          # "BatteryHandler",
          # "RangeFinderHandler",
        ]
      # NOTE: per-instance tuning (type/topic/expected_rate/...) lives in
      # config/public/diagnostics_manager/diagnostics_sensor_handlers.yaml
