mrs_uav_managers:
  diagnostics_manager:
    sensor_handlers:
      # the list of sensors to monitor
      active_sensor_handlers: [
          # Example sensor handlers
          "PX4",
          "Rangefinder",
          "GNSS",
          "Magnetometer",
          "RemoteController",
          # "SimulationCamera"
          # "LidarHandler",
          # "IMUHandler",
          # "BatteryHandler",
          # "RangeFinderHandler",
        ]

      # ExampleHandler:
      # type: "Example" # Example, Autopilot, Camera, Lidar, IMU, GNSS, Battery, Barometer, Magnetometer, RangeFinder
      # topic: "example_node/topic" # Don't add the leading slash, the name will be resolved relative to the node's namespace
      # expected_publisher:
      #   node: "example_node" # Name of the node expected to publish the topic (optional, used for more specific diagnostics)
      #   component: "example_component" # Name of the component within the node expected to publish the topic (optional)
      # qos_reliability: "reliable"              # QoS reliability setting (default: "reliable")
      # expected_rate: 10.0                      # Hz
      # rate_tolerance: 0.3                      # 30% deviation allowed (default)
      # plugin_config: ""                        # optional path to a plugin-owned YAML file for fields this manager doesn't know about
      #                                           # (e.g. message_type, status_topic); if empty, the plugin falls back to its own package-provided default
      # NOTE: the pluginlib class address for each of these is defined in config/private/diagnostics_manager/diagnostics_manager.yaml

      # define "running" instances of plugins, there can be multiple instances of the same plugin
      SimulationCamera:
        type: "Camera"
        topic: "servo_camera/camera_info"
        qos_reliability: "reliable"
        expected_rate: 60.0
        rate_tolerance: 0.3

      # Using generic handler
      PX4:
        type: "Autopilot"
        topic: "hw_api/status"
        qos_reliability: "reliable"
        expected_rate: 100.0
        rate_tolerance: 0.3

      Rangefinder:
        type: "Rangefinder"
        topic: "hw_api/distance_sensor"
        qos_reliability: "reliable"
        expected_rate: 100.0
        rate_tolerance: 0.3

      GNSS:
        type: "GNSS"
        topic: "hw_api/gnss"
        qos_reliability: "reliable"
        expected_rate: 50.0
        rate_tolerance: 0.3

      Magnetometer:
        type: "Magnetometer"
        topic: "hw_api/magnetic_field"
        qos_reliability: "reliable"
        expected_rate: 15.0
        rate_tolerance: 0.3

      RemoteController:
        type: "RemoteController"
        topic: "hw_api/rc_rssi"
        qos_reliability: "reliable"
        expected_rate: 10.0
        rate_tolerance: 0.3
