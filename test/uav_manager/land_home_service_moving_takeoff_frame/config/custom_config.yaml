mrs_uav_managers:

  diagnostics_manager:

    preflight_check:

      # takeoff not allowed if UAV's height sensor exceeds <max_height> -- disabled here since this
      # test spawns the UAV elevated on a takeoff platform (see mrs_simulator.yaml, spawn.z)
      height_check:

        enabled: false

  estimation_manager:

    # loaded state estimator plugins
    # available in mrs_uav_state_estimators: gps_garmin, gps_baro, rtk, ground_truth, dummy
    state_estimators: [
    "gps_garmin",
    "gps_baro",
    # "rtk",
    # "ground_truth",
    # "dummy"
    ]

    initial_state_estimator: "gps_garmin" # will be used as the first state estimator
